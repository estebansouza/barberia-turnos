<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel del local</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="top"><h1>Panel del local<span>.</span></h1></header>

    <section class="step" id="loginBox">
      <h2>Ingresar</h2>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">Entrar</button>
      </form>
      <div id="loginMsg" class="msg error hidden"></div>
    </section>

    <section class="step hidden" id="panel">
      <h2>Agenda del día</h2>
      <label for="day">Día</label>
      <input id="day" type="date">
      <div id="list"></div>
      <button class="btn small" id="logout" type="button" style="margin-top:.75rem">Salir</button>
    </section>

    <footer><a href="index.html">← Volver a la página de reservas</a></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
